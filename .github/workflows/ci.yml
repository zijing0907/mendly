name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

  smoke-test:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ''
      DB_NAME: mendly_db
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, gd
          ini-values: display_errors=On, error_reporting=E_ALL
          tools: none
      - name: Create and seed the database
        run: |
          mysql -h 127.0.0.1 -u root < database/mendly-schema.sql
          mysql -h 127.0.0.1 -u root < database/mendly-data.sql
      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8000 -d display_errors=1 -d error_reporting=E_ALL > server.log 2>&1 &
          sleep 2
      - name: Run smoke test
        run: tests/smoke-test.sh http://127.0.0.1:8000
      - name: Server log
        if: always()
        run: cat server.log
